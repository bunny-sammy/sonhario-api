{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sonhario | Seu diário de hábitos de sono">
    <meta name="theme-color" content="#161616">

    <title>Sonhario</title>

    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/landing.css' %}">
</head>

<body>
    <img class="cloud" src="{% static 'img/cloud.png' %}">
    <img class="cloud" src="{% static 'img/cloud.png' %}">
    <main>
        <img id="logo" src="{% static 'img/logo.svg' %}">
        <h2>Seu diário de hábitos de sono</h2>

        <ul id="links">
            <li onclick="link_download();">
                <img src="{% static 'icons/download.svg' %}">
                <span>Baixar App</span>
            </li>
            <li onclick="link_docs();">
                <img src="{% static 'icons/docs.svg' %}">
                <span>Documentação</span>
            </li>
            <li onclick="link_code();">
                <img src="{% static 'icons/code.svg' %}">
                <span>Repositório</span>
            </li>
            <li onclick="link_share();">
                <img src="{% static 'icons/share.svg' %}">
                <span>Compartilhar</span>
            </li>
        </ul>
    </main>
</body>

<script>
    function link_download () {
        console.log("Em construção!");
    }

    function link_docs () {
        window.open(window.location.href + '/docs');
    }

    function link_code () {
        window.open('https://github.com/bunny-sammy/sonhario-api');
    }

    function link_share () {
        const shareData = {
            title: `Sonhario`,
            url: window.location.href,
        };
        if (navigator.canShare(shareData)) {
            navigator.share(shareData);
        } else {
            navigator.clipboard.writeText(shareData.url);
        }
    }
</script>
</html>
