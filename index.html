<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Seu diário de hábitos de sono">
    <meta name="theme-color" content="#161616">

    <title>Sonhario</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="public/css/main.css">
    <link rel="stylesheet" href="public/css/landing.css">
</head>

<body>
    <img class="cloud" src="public/img/cloud.png">
    <img class="cloud" src="public/img/cloud.png">
    <div id="background"></div>
    <main>
        <img id="logo" src="public/img/logo.svg">
        <h2>Seu diário de hábitos de sono</h2>

        <ul id="links">
            <li onclick="link_download();">
                <img src="public/icons/download.svg">
                <span>Baixar App</span>
            </li>
            <li>
                <a href="docs.html">
                    <img src="public/icons/docs.svg">
                    <span>Documentação</span>
                </a>
            </li>
            <li onclick="link_code();">
                <img src="public/icons/code.svg">
                <span>Repositório</span>
            </li>
            <li onclick="link_share();">
                <img src="public/icons/share.svg">
                <span>Compartilhar</span>
            </li>
        </ul>
    </main>
</body>

<script>
    function link_download () {
        window.open('https://github.com/omarcosss/sonhario-front/releases/latest');
    }

    function link_code () {
        window.open('https://github.com/bunny-sammy/sonhario-api');
    }

    function link_share () {
        const shareData = {
            title: `Sonhario`,
            url: window.location.href,
        };
        if (navigator.canShare(shareData)) {
            navigator.share(shareData);
        } else {
            navigator.clipboard.writeText(shareData.url);
        }
    }
</script>
</html>
